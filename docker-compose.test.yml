# CI integration-test infra — separate ports from docker-compose.yml so
# both can run side by side without conflict. tmpfs storage: clean slate
# every run, nothing persisted between CI jobs.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nahuat_test
      POSTGRES_USER: nahuat
      POSTGRES_PASSWORD: nahuat
    ports: ['5433:5432']
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nahuat -d nahuat_test']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ['6380:6379']
    tmpfs: [/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
