# Local dev infrastructure only — apps/api and apps/web run natively via
# `npm run dev` (Turborepo), not as containers here. Start with:
#   npm run dev:infra
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nahuat_dev
      POSTGRES_USER: nahuat
      POSTGRES_PASSWORD: nahuat
    ports: ['5432:5432']
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nahuat -d nahuat_dev']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    volumes: [redis_data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
